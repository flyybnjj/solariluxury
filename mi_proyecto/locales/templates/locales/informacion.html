{% extends "base.html" %}
{% block title %}Tracker | SOLARY LUXURY{% endblock %}
{% block extra_head %}
<style>
  .tracker-page { min-height:calc(100vh - 170px); display:grid; place-items:center; padding:42px 20px 70px; color:#1d1d1f; background:var(--app-backdrop,linear-gradient(135deg,#dce9fb,#f7f8fb)); }
  .tracker-card { width:min(100%,820px); padding:clamp(28px,6vw,64px); border:1px solid rgba(255,255,255,.9); border-radius:30px; background:rgba(255,255,255,.72); box-shadow:0 24px 70px rgba(44,61,85,.12); backdrop-filter:blur(24px); text-align:center; }
  .tracker-kicker { color:#0071e3; font-size:10px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
  .tracker-card h1 { margin:13px 0 12px; font-size:clamp(38px,8vw,72px); line-height:1; letter-spacing:-.07em; }
  .tracker-copy { max-width:520px; margin:0 auto; color:#626269; font-size:15px; line-height:1.65; }
  .tracker-scene { position:relative; height:130px; margin:42px auto 0; overflow:hidden; }
  .tracker-road { position:absolute; right:0; bottom:21px; left:0; height:2px; background:linear-gradient(90deg,transparent,#b6c9e4 12%,#b6c9e4 88%,transparent); }
  .tracker-road::after { content:""; position:absolute; top:0; left:0; width:100%; height:1px; background:repeating-linear-gradient(90deg,transparent 0 24px,#fff 24px 42px,transparent 42px 64px); }
  .tracker-truck { position:absolute; bottom:25px; left:-100px; width:92px; height:66px; color:#0071e3; animation:tracker-drive 7s cubic-bezier(.45,.05,.55,.95) infinite; }
  .tracker-truck svg { width:100%; height:100%; overflow:visible; }
  .tracker-wheel { transform-box:fill-box; transform-origin:center; animation:tracker-wheel-spin .75s linear infinite; }
  @keyframes tracker-drive { 0%{left:-100px} 80%,100%{left:calc(100% + 100px)} }
  @keyframes tracker-wheel-spin { to{transform:rotate(360deg)} }
  @media(prefers-reduced-motion:reduce) { .tracker-truck,.tracker-wheel { animation:none; } .tracker-truck { left:calc(50% - 46px); } }
</style>
{% endblock %}
