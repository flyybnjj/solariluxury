<style>
  .apple-halo-badge{position:relative;width:130px;height:130px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}

  .auth-form{display:flex;flex-direction:column;gap:15px}.auth-field{display:flex;flex-direction:column;gap:7px}.auth-label{font-size:12px;font-weight: var(--fw-main);color:#424245}.auth-input{width:100%;height:46px;box-sizing:border-box;padding:0 15px;border:1px solid #e3e3e8;border-radius:13px;background:rgba(255,255,255,.78);color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}.auth-input:focus{border-color:#0071e3;background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.14)}
